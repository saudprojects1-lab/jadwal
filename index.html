<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDE8D2">
<title>جدول الضيافة — أيام الجمعة</title>
<meta name="description" content="جدول الضيافة لأيام الجمعة">
<meta property="og:title" content="جدول الضيافة — أيام الجمعة">
<meta property="og:description" content="اطّلعي على بند الضيافة الخاص بك لكل جمعة">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body>
<a id="top"></a>

<noscript>
    <div class="nojs-banner">هذه الصفحة تحتاج إلى JavaScript — افتحي الرابط في المتصفح (Safari أو Chrome) لعرض الجدول.</div>
</noscript>

<header class="top-bar">
    <button class="admin-entry no-export" id="adminEntry" type="button" aria-label="دخول وضع المدير" title="دخول وضع المدير">⚙</button>
    <h1 id="siteTitle">جدول الضيافة</h1>
    <div class="subtitle" id="siteSubtitle">أيام الجمعة</div>
</header>

<!-- Admin toolbar (visible only in admin mode) -->
<div class="admin-bar no-export" id="adminBar" hidden>
    <div class="admin-bar-inner">
        <div class="save-state" id="saveState" data-state="clean">
            <span class="save-dot" aria-hidden="true"></span>
            <span class="save-text" id="saveText">محفوظ</span>
        </div>
        <button type="button" class="bar-btn" id="undoBtn" title="تراجع (Ctrl+Z)" aria-label="تراجع" disabled>↶</button>
        <button type="button" class="bar-btn" id="redoBtn" title="إعادة (Ctrl+Y)" aria-label="إعادة" disabled>↷</button>
        <button type="button" class="bar-btn issues-btn" id="issuesBtn" hidden>⚠ <span id="issuesCount">0</span></button>
        <span class="bar-spacer"></span>
        <button type="button" class="bar-btn" id="openDrawerBtn">⚙ الإدارة</button>
        <button type="button" class="bar-btn primary" id="saveBtn" title="حفظ ونشر (Ctrl+S)">💾 حفظ</button>
        <button type="button" class="bar-btn ghost" id="logoutBtn" title="خروج من وضع المدير" aria-label="خروج">🔒</button>
    </div>
    <div class="draft-banner" id="draftBanner" hidden></div>
</div>

<main class="wrap">
    <div class="load-state" id="loadState">
        <div class="spinner" aria-hidden="true"></div>
        <span>جارٍ تحميل الجدول…</span>
    </div>

    <section class="hero" id="heroHost" hidden></section>

    <aside class="notices" id="noticesBox" aria-label="تنبيهات وملاحظات" hidden>
        <div class="notices-head">
            <span class="notices-icon" aria-hidden="true">⚠️</span>
            <h2>تنبيهات وملاحظات هامة</h2>
        </div>
        <ul class="notices-list" id="noticesList"></ul>
    </aside>

    <div class="toolbar" id="toolbar" hidden>
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="ابحث عن اسم..." autocomplete="off">
        </div>
        <div class="my-select">
            <select id="mySelect" aria-label="اعرضي جدولي">
                <option value="">👤 جدولي…</option>
            </select>
        </div>
        <button type="button" class="tool-btn" id="exportAllBtn" title="تصدير كل الجمعات كصور">🖼 تصدير الكل</button>
    </div>

    <div id="myCardHost"></div>

    <nav class="index" id="indexBox" hidden>
        <h2>الجمعات</h2>
        <ul id="indexList"></ul>
    </nav>

    <div class="mobile-pager" role="navigation" aria-label="تنقّل بين الجمعات">
        <button class="pager-btn" id="prevMonthBtn" aria-label="الجمعة السابقة" disabled>›</button>
        <select class="pager-select" id="monthSelect" aria-label="اختر يوم الجمعة"></select>
        <button class="pager-btn" id="nextMonthBtn" aria-label="الجمعة التالية">‹</button>
    </div>

    <div class="past-toggle-row" id="pastToggleRow" hidden>
        <button type="button" class="past-toggle" id="pastToggle"></button>
    </div>

    <div id="monthsHost"></div>

    <div class="swipe-hint">اسحبي يميناً أو يساراً للتنقّل بين الجمعات</div>

    <section class="legend" id="legendBox" hidden>
        <h3>دليل البنود</h3>
        <div class="legend-grid" id="legendGrid"></div>
    </section>

    <div class="print-area" id="printArea" hidden>
        <button class="print-btn" id="printBtn" type="button">🖨️ طباعة / حفظ PDF</button>
    </div>
</main>

<!-- Admin drawer (content rendered by js/admin.js) -->
<aside class="drawer no-export" id="drawer" aria-hidden="true">
    <div class="drawer-head">
        <h2>لوحة الإدارة</h2>
        <button type="button" class="modal-x" id="drawerClose" aria-label="إغلاق">✕</button>
    </div>
    <nav class="drawer-tabs" id="drawerTabs" role="tablist">
        <button type="button" data-tab="items" class="active">🍽 البنود</button>
        <button type="button" data-tab="people">👥 الأشخاص</button>
        <button type="button" data-tab="dates">📅 التواريخ</button>
        <button type="button" data-tab="distribute">🔄 التوزيع</button>
        <button type="button" data-tab="content">📝 النصوص</button>
        <button type="button" data-tab="settings">💾 الحفظ والإعدادات</button>
    </nav>
    <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="drawer-backdrop no-export" id="drawerBackdrop"></div>

<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
